# Kök OS: disk bölümleme ayarları (güvenli varsayılan: diğer işletim sistemlerini koru)
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"
# Tek seçenek: takas alanı sorusu hiç sorulmaz (sade kurulum)
userSwapChoices:
    - small
luksGeneration: luks2
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
# Varsayılan seçim: "yanına kur" (Windows vb. silinmez)
initialPartitioningChoice: alongside
initialSwapChoice: small
defaultFileSystemType:  "ext4"
essentialMounts: [ "live-*", "control", "ventoy" ]
# Elle bölümleme düğmesi gizli: kullanıcı yalnızca basit seçenekleri görür
allowManualPartitioning: false
# "Sistemi şifrele" kutusu gizli (sade kurulum)
enableLuksAutomatedPartitioning: false
lvm:
    enable: false
