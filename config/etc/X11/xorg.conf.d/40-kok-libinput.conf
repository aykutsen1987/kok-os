# Kök OS: dokunmatik yüzey (touchpad) varsayılanları – Windows alışkanlığı
Section "InputClass"
    Identifier "kok touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "ClickMethod" "clickfinger"
    Option "NaturalScrolling" "false"
    Option "DisableWhileTyping" "on"
EndSection
