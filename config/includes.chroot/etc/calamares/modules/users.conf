# Kök OS: sade kullanıcı sayfası (ad, kullanıcı adı, parola)
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
# Bilgisayar adı sorulmaz; kurulum sonunda "kok-os" yazılır (kok-kurulum-bitir)
hostname:
  location: None
  writeHostsFile: false
presets:
    fullName:
        value: ""
        editable: true
    loginName:
        value: ""
        editable: true
allowActiveDirectory: false
